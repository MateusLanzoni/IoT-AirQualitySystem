# config.yaml - ThingSpeak Adaptor Mapping Configuration

global:
  update_interval_seconds: 15
  timeout_seconds: 10

channels:

  # Channel 1: Indoor Air Quality (IAQ) Telemetry

  - channel_id: 3319669
    write_api_key: "${THINGSPEAK_WRITE_API_KEY}"
    read_api_key: "${THINGSPEAK_READ_API_KEY}"
    fields:
      field1: "airguard/{room_id}"
      field2: "airguard/{room_id}/telemetry/sensor/temp_1"
      field3: "airguard/{room_id}/telemetry/sensor/humi_1"
      field4: "airguard/{room_id}/telemetry/sensor/co2_1"
      field5: "airguard/{room_id}/telemetry/sensor/pm25_1"
      field6: "airguard/{room_id}/telemetry/actuator/ac_1"
      field7: "airguard/{room_id}/telemetry/actuator/fan_1"
    status_source: null


  # Channel 2: Decision Command

  - channel_id: 3355807
    write_api_key: "${THINGSPEAK_COMMAND_WRITE_API_KEY}"
    fields:
      field1: "airguard/{room_id}/command/actuator/ac_1"
      field2: "airguard/{room_id}/command/actuator/fan_1"
    status_source: null