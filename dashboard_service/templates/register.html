<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AirGuard Create User</title>
  <style>
    :root {
      --bg: #08111b;
      --panel: rgba(12, 20, 32, 0.86);
      --line: rgba(149, 180, 216, 0.18);
      --text: #ecf4ff;
      --muted: #93a4bc;
      --accent: #49d6a7;
      --bad: #ff7d7d;
      --good: #67e8a4;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.34);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(121, 167, 255, 0.16), transparent 36%),
        radial-gradient(circle at 80% 10%, rgba(73, 214, 167, 0.13), transparent 28%),
        linear-gradient(180deg, #08111b 0%, #09131f 52%, #050b12 100%);
      font-family: "Trebuchet MS", "Gill Sans", "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .panel {
      width: min(640px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      padding: 28px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(103, 232, 164, 0.24);
      color: var(--accent);
      background: rgba(73, 214, 167, 0.07);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 16px 0 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 0.96;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.6;
    }

    .notice {
      margin: 0 0 16px;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid rgba(103, 232, 164, 0.24);
      background: rgba(73, 214, 167, 0.07);
      color: var(--good);
      font-size: 13px;
    }

    .notice.bad {
      border-color: rgba(255, 125, 125, 0.24);
      background: rgba(255, 125, 125, 0.08);
      color: var(--bad);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(3, 8, 14, 0.55);
      color: var(--text);
      outline: none;
    }

    input:focus, select:focus { border-color: rgba(121, 167, 255, 0.5); }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .button, .link-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      padding: 11px 16px;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
    }

    .button {
      border: 1px solid rgba(121, 167, 255, 0.18);
      background: rgba(121, 167, 255, 0.14);
      color: var(--text);
    }

    .link-button {
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
    }

    .footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="panel">
    <span class="eyebrow">AirGuard Access</span>
    <h1>Create user</h1>
    <p>Create a normal user and link it to the admin account that owns it.</p>

    {% if message %}
    <div class="notice">{{ message }}</div>
    {% endif %}
    {% if error %}
    <div class="notice bad">{{ error }}</div>
    {% endif %}

    <form method="post" action="/register">
      <div class="grid">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required>
        </div>
      </div>
      <div class="field">
        <label for="admin_username">Admin owner</label>
        <select id="admin_username" name="admin_username" required>
          {% for admin in admins %}
          <option value="{{ admin.username }}">{{ admin.username }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="actions">
        <button class="button" type="submit">Create user</button>
        <a class="link-button" href="/login">Back to login</a>
      </div>
    </form>

    <div class="footer">
      Disabled users stay in the database but cannot sign in.
    </div>
  </main>
</body>
</html>
