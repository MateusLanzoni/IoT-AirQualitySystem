
services:
  # Service name: mqtt-broker
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: airguard-mosquitto

    # ports Mapping: <Laptop Port> : <Container Port>
    # This allows RPI or MQTT Explorer to find the broker
    ports:
      - "1883:1883" # MQTT protocol
      - "9001:9001" # WebSockets

    # Volumes: we map local config file into the container's expected path
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

    #Network: keep microservices in the same virtual room
    networks:
      - airguard-network

    # Auto-restart: if the broker crashes, it will try to restart
    restart: unless-stopped

  sensor-service:
    build: .
    container_name: airguard-sensor
    command: ["python", "main_sensor.py"]
    depends_on:
      - mosquitto
    environment:

      - MQTT_BROKER=mosquitto
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    networks:
      - airguard-network
    restart: unless-stopped

  adaptor-service:
    build: .
    container_name: airguard-adaptor
    command: ["python", "main_adaptor.py"]
    depends_on:
      - mosquitto
    ports:
      - "8000:8000"
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - THINGSPEAK_WRITE_API_KEY=${THINGSPEAK_WRITE_API_KEY}
      - THINGSPEAK_READ_API_KEY=${THINGSPEAK_READ_API_KEY}
    networks:
      - airguard-network
    restart: unless-stopped
    volumes:
      - ./components/adaptor/config.yaml:/app/config.yaml:ro

  dashboard-service:
    build:
      context: .
      dockerfile: dashboard_service/Dockerfile
    container_name: airguard-dashboard
    ports:
      - "8501:8501"
    environment:
      - CATALOG_SERVICE_URL=http://catalog-service:8001
      - PREDICTION_SERVICE_URL=http://prediction-service:8003
      - DECISION_SERVICE_URL=http://host.docker.internal:8002
      - ADAPTOR_SERVICE_URL=http://adaptor-service:8000
      - ADAPTOR_CONFIG_PATH=/app/adaptor_config.yaml
      - ROOT_ENV_PATH=/app/.env
      - DEFAULT_ROOM_ID=room1
    extra_hosts:
      # Lets the dashboard still reach a Decision Service running on the host
      # (decision is not containerized in this compose file).
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.env:/app/.env:rw
      - ./components/adaptor/config.yaml:/app/adaptor_config.yaml:ro
    networks:
      - airguard-network
    restart: unless-stopped

  # Room Catalog: device/service registry (REST). Prediction registers here.
  catalog-service:
    build:
      context: ./catalog_service
    container_name: airguard-catalog
    ports:
      - "8001:8001"
    environment:
      - SERVER_HOST=0.0.0.0
    networks:
      - airguard-network
    restart: unless-stopped

  # Prediction Service: short-term IAQ forecasting (REST).
  # Reads room history from the adaptor and registers with the catalog.
  prediction-service:
    build:
      context: ./services/prediction
    container_name: airguard-prediction
    depends_on:
      - adaptor-service
      - catalog-service
    ports:
      - "8003:8003"
    environment:
      - THINGSPEAK_ADAPTER_BASE_URL=http://adaptor-service:8000
      - ROOM_CATALOG_BASE_URL=http://catalog-service:8001
      - SERVICE_URL=http://prediction-service:8003
      # How far back to look for room history. 1 day is plenty when the sensor
      # is publishing live; raise it if testing against older data.
      - HISTORY_LOOKBACK_DAYS=${HISTORY_LOOKBACK_DAYS:-1}
      # Optional Turin outdoor AQI token (forecast still works without it).
      - OUTDOOR_AQI_TOKEN=${OUTDOOR_AQI_TOKEN:-}
    networks:
      - airguard-network
    restart: unless-stopped

  telegram-notifier:
    build:
      context: ./telegram_notifier
    container_name: airguard-telegram
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_ALERT_TOPIC=alert/#
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_BOT_NAME=AirGuard Alerts
    networks:
      - airguard-network
    restart: unless-stopped

networks:
  airguard-network:
    driver: bridge