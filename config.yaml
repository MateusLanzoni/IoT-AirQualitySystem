# config.yaml (mock Catalog )

sensors:
  - key: "temp_01"
    name: "Temperature"
    device_class: "temperature"
    unit: "°C"
    base_val: 26.0
    noise: 0.3


    
  - key: "hum_01"
    name: "Humidity"
    device_class: "humidity"
    unit: "%"
    base_val: 55.0
    noise: 2.0
  - key: "co2_01"
    name: "CO2 Level"
    device_class: "aqi"
    unit: "ppm"
    base_val: 600.0
    noise: 15.0
  - key: "pm25_01"
    name: "PM2.5"
    device_class: "pm25"
    unit: "µg/m³"
    base_val: 35.0
    noise: 5.0

actuators:
  - key: "ac_01"
    name: "Air Conditioner"
    device_class: "climate"
    initial_state: false
  - key: "fan_01"
    name: "Ventilation Fan"
    device_class: "switch"
    initial_state: false